# helm upgrade --install <app>-uat helm/bwce-app -n <ns> -f bwce/apps/<app>/values-uat.yaml
#
# Prerequisites (see bwce/README.md step 6):
#   kubectl -n <ns> create secret generic tibco-certs \
#     --from-file=certs.jks=local/<app>/cert/client/certs.jks \
#     --from-file=server.p12=local/<app>/cert/server/server.p12
#   kubectl -n <ns> create secret generic <app>-profile --from-file=UAT.substvar=local/<app>/UAT.substvar

fullnameOverride: my-app

image:
  repository: harbor.example.com/tibco/my-app   # private registry
  tag: "1.0.0"

imagePullSecrets:
  - name: regcred   # or an existing pull secret that covers your registry

replicaCount: 1

bwce:
  profile: UAT
  logLevel: INFO
  javaOpts: "-Xms256m -Xmx768m"   # ~75% of resources.limits.memory

appConfig: {}        # non-secret #TOKEN# values, if the EAR uses them

externalProfile:     # profile generated by fix-profile.sh, as a Secret
  enabled: true
  secretName: my-app-profile

ports:
  - name: https
    containerPort: 8443          # the app's /HTTP/Port

service:
  ports:
    https: 8443

extraVolumes:
  - name: client-certs
    secret:
      secretName: tibco-certs
      items:
        - { key: certs.jks, path: certs.jks }
  - name: server-certs
    secret:
      secretName: tibco-certs
      items:
        - { key: server.p12, path: server.p12 }

extraVolumeMounts:               # paths must match the profile's keystore properties
  - name: client-certs
    mountPath: /data/conf/tibco/cert/client
    readOnly: true
  - name: server-certs
    mountPath: /data/conf/tibco/cert/server
    readOnly: true

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { memory: 1Gi }

podDisruptionBudget:
  enabled: false   # enable with replicaCount >= 2
