{{- if and .Values.appSecret.data (not .Values.appSecret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bwce-app.fullname" . }}
  labels:
    {{- include "bwce-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.appSecret.data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
